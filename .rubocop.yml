# VisionHub lint configuration. Runtime code and specs share the same rules
# except where noted; new cops stay on so upgrades surface modern idioms.

plugins:
  - rubocop-performance
  - rubocop-rake
  - rubocop-rspec

AllCops:
  TargetRubyVersion: 3.4
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - "vendor/**/*"
    - "**/*.qml"

Style/Documentation:
  # Every class carries a comment anyway; this cop's boilerplate demands are
  # stricter than useful here (e.g. it wants docs on tiny exception classes).
  Enabled: false

Layout/LineLength:
  Max: 120

Metrics/MethodLength:
  Max: 25
  Exclude:
    - "spec/**/*"

Metrics/BlockLength:
  Exclude:
    - "spec/**/*"
    - "Rakefile"

Metrics/AbcSize:
  Max: 22

Metrics/ClassLength:
  # FramePump and Supervisor are cohesive state machines; carving them up
  # would spread lifecycle transitions across files without reducing coupling.
  Exclude:
    - "lib/vision_hub/frame_pump.rb"
    - "lib/vision_hub/supervisor.rb"

Metrics/ParameterLists:
  # FramePump#initialize mirrors its collaborators one-to-one so specs can
  # inject fakes for every seam. Camera's keyword constructor mirrors
  # cameras.json the same way.
  Max: 11

RSpec/ExampleLength:
  Max: 15

RSpec/MultipleMemoizedHelpers:
  # Process-fake specs (spawner/reaper/killer seams) legitimately need many
  # small lets; they read as a fixture table, not as hidden coupling.
  Max: 18

RSpec/MultipleExpectations:
  Max: 6

RSpec/NestedGroups:
  Max: 4
